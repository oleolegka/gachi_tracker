name: release

# A release is built from a tag like v0.1.0. Obtainium watches GitHub Releases and picks
# up the APK asset automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # can also be started by hand from the Actions tab

permissions:
  contents: write         # needed to create the release and attach the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # The signing key comes from the repository secrets and never leaves the runner.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set — a signed release is impossible." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Secrets pasted through a browser often pick up a trailing newline or stray
      # whitespace, which surfaces later as a bare "keystore password was incorrect".
      # Normalise it here and check the key opens before the build starts, so a wrong
      # secret fails fast with a message that says what to fix.
      - name: Check the signing password
        env:
          KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d '[:space:]')
          if [ -z "$PASS" ]; then
            echo "The ANDROID_KEYSTORE_PASSWORD secret is empty." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -alias gachi >/dev/null 2>&1; then
            echo "ANDROID_KEYSTORE_PASSWORD does not open the keystore, or alias 'gachi' is missing." >&2
            echo "Re-copy the password into the repository secret and make sure nothing is truncated." >&2
            exit 1
          fi
          echo "The keystore opens and contains the 'gachi' key."
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: gachi
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify that the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$APK_PATH" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build from tag ${GITHUB_REF_NAME}. Install via Obtainium."
